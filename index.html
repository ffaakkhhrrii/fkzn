<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/images/icon.png" />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Apply the saved (or system) theme before first paint so there's no flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121311');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Bricolage Grotesque (headings) + Inter (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Fakhri Zain – Software Developer</title>
    <meta
      name="description"
      content="Fakhri Zain is a software developer in Jakarta building Android apps, web platforms and integrate LLM features. Projects, experience, awards and contact."
    />
    <meta name="author" content="Fakhri Zain" />
    <link rel="canonical" href="https://fkzn.my.id/" />

    <!-- Open Graph -->

    <meta property="og:url" content="https://fkzn.my.id/" />

    <meta
      property="og:description"
      content="Android apps, web platforms and LLM features. 2+ years at ADW Consulting, Jakarta."
    />
    <meta property="og:image" content="https://fkzn.my.id/assets/images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->

      name="twitter:description"

  </head>
